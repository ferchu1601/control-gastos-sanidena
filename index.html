<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Gastos - SANIDENA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    // Configuración de Firebase SANIDENA
    const firebaseConfig = {
      apiKey: "AIzaSyCBO4sAgRwssv-JfSmj7d7oVMMIZ12S_KU",
      authDomain: "control-gastos-51669.firebaseapp.com",
      projectId: "control-gastos-51669",
      storageBucket: "control-gastos-51669.firebasestorage.app",
      messagingSenderId: "717639817293",
      appId: "1:717639817293:web:3e3da65bb5fb606427a404"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    function App() {
      // Clave PIN de seguridad (1234)
      const [pin] = React.useState('1234');
      const [pinIngresado, setPinIngresado] = React.useState('');
      const [autenticado, setAutenticado] = React.useState(false);
      const [errorPin, setErrorPin] = React.useState(false);

      // Estados de datos
      const [cajaAhorro, setCajaAhorro] = React.useState(0);
      const [transacciones, setTransacciones] = React.useState([]);
      const [cargando, setCargando] = React.useState(true);

      const [editandoCaja, setEditandoCaja] = React.useState(false);
      const [tempCaja, setTempCaja] = React.useState('');
      const [ocultarSaldo, setOcultarSaldo] = React.useState(false);

      // Filtro de mes
      const [mesFiltro, setMesFiltro] = React.useState('TODOS');

      const [monto, setMonto] = React.useState('');
      const [descripcion, setDescripcion] = React.useState('');
      const [categoria, setCategoria] = React.useState('Supermercado');
      const [metodo, setMetodo] = React.useState('mercado_pago');
      const [editandoId, setEditandoId] = React.useState(null);

      // Sincronización en tiempo real
      React.useEffect(() => {
        const unsubCaja = db.collection('datos_sanidena').doc('caja').onSnapshot((doc) => {
          if (doc.exists) {
            setCajaAhorro(doc.data().monto || 0);
          } else {
            db.collection('datos_sanidena').doc('caja').set({ monto: 0 });
          }
        });

        const unsubTx = db.collection('transacciones_sanidena')
          .orderBy('fechaId', 'desc')
          .onSnapshot((snapshot) => {
            const txs = snapshot.docs.map(doc => ({
              id: doc.id,
              ...doc.data()
            }));
            setTransacciones(txs);
            setCargando(false);
          });

        return () => {
          unsubCaja();
          unsubTx();
        };
      }, []);

      const validarAcceso = (e) => {
        e.preventDefault();
        if (pinIngresado === pin) {
          setAutenticado(true);
          setErrorPin(false);
        } else {
          setErrorPin(true);
        }
      };

      const guardarCajaAhorro = async (e) => {
        e.preventDefault();
        const nuevoValor = parseFloat(tempCaja) || 0;
        await db.collection('datos_sanidena').doc('caja').set({ monto: nuevoValor });
        setEditandoCaja(false);
      };

      const guardarTransaccion = async (e) => {
        e.preventDefault();
        if (!monto || isNaN(monto)) return;

        const hoy = new Date();
        const fechaTxt = hoy.toLocaleDateString('es-AR');
        // Guardamos también formato YYYY-MM para filtrar fácilmente
        const mesClave = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}`;

        if (editandoId) {
          await db.collection('transacciones_sanidena').doc(editandoId).update({
            monto: parseFloat(monto),
            descripcion,
            categoria,
            metodo
          });
          setEditandoId(null);
        } else {
          const nuevaTx = {
            fechaId: Date.now(),
            monto: parseFloat(monto),
            descripcion,
            categoria,
            metodo,
            fecha: fechaTxt,
            mesClave: mesClave
          };
          await db.collection('transacciones_sanidena').add(nuevaTx);
        }
        setMonto('');
        setDescripcion('');
      };

      const editarTransaccion = (tx) => {
        setEditandoId(tx.id);
        setMonto(tx.monto);
        setDescripcion(tx.descripcion || '');
        setCategoria(tx.categoria);
        setMetodo(tx.metodo);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const eliminarTransaccion = async (id) => {
        await db.collection('transacciones_sanidena').doc(id).delete();
        if (editandoId === id) {
          setEditandoId(null);
          setMonto('');
          setDescripcion('');
        }
      };

      // Funcionalidad: Eliminar TODOS los registros
      const vaciarTodosLosRegistros = async () => {
        const confirmar = window.confirm('⚠️ ¿Estás segura de que quieres borrar TODOS los registros de gastos para reiniciar el mes? Esta acción no se puede deshacer.');
        if (!confirmar) return;

        const snapshot = await db.collection('transacciones_sanidena').get();
        const batch = db.batch();
        snapshot.docs.forEach((doc) => {
          batch.delete(doc.ref);
        });
        await batch.commit();
        alert('¡Todos los registros han sido borrados con éxito!');
      };

      // Funcionalidad: Exportar a Excel (CSV)
      const exportarExcel = () => {
        if (transacciones.length === 0) {
          alert('No hay datos registrados para exportar.');
          return;
        }

        const encabezados = ["Fecha", "Categoria", "Metodo de Pago", "Descripcion", "Monto ($)"];
        const filas = txsFiltradas.map(tx => [
          `"${tx.fecha || ''}"`,
          `"${tx.categoria || ''}"`,
          `"${(tx.metodo || '').replace('_', ' ')}"`,
          `"${(tx.descripcion || '').replace(/"/g, '""')}"`,
          tx.monto
        ]);

        const contenidoCSV = "\uFEFF" + [encabezados.join(";"), ...filas.map(f => f.join(";"))].join("\n");
        const blob = new Blob([contenidoCSV], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `Gastos_Sanidena_${mesFiltro === 'TODOS' ? 'Completo' : mesFiltro}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Obtener lista de meses disponibles para el selector
      const obtenerMesesDisponibles = () => {
        const mesesSet = new Set();
        transacciones.forEach(tx => {
          if (tx.mesClave) {
            mesesSet.add(tx.mesClave);
          } else if (tx.fecha) {
            const partes = tx.fecha.split('/');
            if (partes.length === 3) {
              mesesSet.add(`${partes[2]}-${partes[1].padStart(2, '0')}`);
            }
          }
        });
        return Array.from(mesesSet).sort().reverse();
      };

      // Filtrar transacciones según el mes seleccionado
      const txsFiltradas = transacciones.filter(tx => {
        if (mesFiltro === 'TODOS') return true;
        if (tx.mesClave) return tx.mesClave === mesFiltro;
        if (tx.fecha) {
          const partes = tx.fecha.split('/');
          if (partes.length === 3) {
            const m = `${partes[2]}-${partes[1].padStart(2, '0')}`;
            return m === mesFiltro;
          }
        }
        return true;
      });

      const totalGastos = txsFiltradas.reduce((acc, tx) => acc + tx.monto, 0);
      const saldoRestante = cajaAhorro - totalGastos;

      // --- PANTALLA DE BLOQUEO POR PIN ---
      if (!autenticado) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-slate-900">
            <form onSubmit={validarAcceso} className="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-full space-y-5 text-center">
              <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">
                🔒
              </div>
              <div>
                <h2 className="text-xl font-bold text-slate-800">Control de Gastos</h2>
                <p className="text-xs text-slate-500 mt-1">Usuario: <span className="font-semibold text-slate-700">SANIDENA</span></p>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-2">Ingresa tu clave de acceso</label>
                <input 
                  type="password" 
                  value={pinIngresado}
                  onChange={(e) => setPinIngresado(e.target.value)}
                  placeholder="••••"
                  className="w-full text-center text-2xl tracking-widest border border-slate-300 rounded-xl p-3 bg-slate-50 focus:outline-none focus:border-emerald-500"
                  required
                />
                {errorPin && (
                  <p className="text-xs text-rose-600 mt-2 font-medium">Clave incorrecta. Intenta nuevamente.</p>
                )}
              </div>

              <button type="submit" className="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl hover:bg-emerald-500 transition shadow-md">
                Ingresar a la App
              </button>
            </form>
          </div>
        );
      }

      // --- PANTALLA PRINCIPAL ---
      return (
        <div className="max-w-md mx-auto p-4 space-y-6 pb-12">
          <header className="border-b border-slate-300 pb-4 flex justify-between items-center">
            <div>
              <h1 className="text-xl font-bold text-emerald-700 text-left">Control de Gastos</h1>
              <p className="text-xs text-slate-600 text-left">Usuario: <span className="font-semibold text-slate-900">SANIDENA</span></p>
            </div>
            <div className="flex gap-2">
              <button 
                onClick={() => setOcultarSaldo(!ocultarSaldo)}
                className="text-xs bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg font-semibold hover:bg-slate-300 transition"
              >
                {ocultarSaldo ? '👁️ Ver' : '🙈 Ocultar'}
              </button>
              <button 
                onClick={() => setAutenticado(false)}
                className="text-xs bg-rose-100 text-rose-700 px-2.5 py-1.5 rounded-lg font-semibold hover:bg-rose-200 transition"
                title="Bloquear app"
              >
                🔒 Salir
              </button>
            </div>
          </header>

          {/* Caja de Ahorro */}
          <div className="bg-white p-4 rounded-xl border border-slate-300 shadow-sm space-y-3">
            <div className="flex justify-between items-center">
              <h2 className="text-xs font-bold text-slate-500 uppercase">Caja de Ahorro / Ingreso Mensual</h2>
              <button 
                onClick={() => { setTempCaja(cajaAhorro); setEditandoCaja(!editandoCaja); }}
                className="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-md font-semibold hover:bg-emerald-200 transition"
              >
                {editandoCaja ? 'Cancelar' : 'Actualizar Dinero'}
              </button>
            </div>

            {editandoCaja ? (
              <form onSubmit={guardarCajaAhorro} className="space-y-3 pt-2 border-t border-slate-200">
                <div>
                  <label className="block text-xs font-medium text-slate-600 mb-1">Dinero total en tu caja de ahorro ($)</label>
                  <input 
                    type="number" 
                    value={tempCaja} 
                    onChange={e => setTempCaja(e.target.value)} 
                    placeholder="Ej: 300000" 
                    className="w-full border rounded-lg p-2 bg-slate-50 text-slate-900" 
                    required 
                  />
                </div>
                <button type="submit" className="w-full bg-emerald-600 text-white py-2 rounded-lg text-sm font-bold hover:bg-emerald-500">
                  Guardar Dinero Mensual
                </button>
              </form>
            ) : (
              <div>
                <p className="text-3xl font-extrabold text-emerald-600">
                  {ocultarSaldo ? '••••••••' : `$${cajaAhorro.toLocaleString('es-AR')}`}
                </p>
                <p className="text-xs text-slate-400 mt-1">De aquí se descontarán tus gastos de Mercado Pago, transferencias y otros.</p>
              </div>
            )}
          </div>

          {/* Saldo Restante */}
          <div className="bg-white p-4 rounded-xl border border-slate-300 shadow-sm">
            <h2 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">
              Dinero Restante {mesFiltro !== 'TODOS' ? `(${mesFiltro})` : ''}
            </h2>
            <p className={`text-3xl font-extrabold ${saldoRestante < 0 ? 'text-rose-600' : 'text-slate-800'}`}>
              {ocultarSaldo ? '••••••••' : `$${saldoRestante.toLocaleString('es-AR')}`}
            </p>
            <p className="text-xs text-slate-400 mt-1">Total Gastado: {ocultarSaldo ? '••••' : `$${totalGastos.toLocaleString('es-AR')}`}</p>
          </div>

          {/* Formulario de Gastos */}
          <form onSubmit={guardarTransaccion} className="bg-white p-4 rounded-xl border border-slate-300 shadow-sm space-y-4">
            <div className="flex justify-between items-center border-b border-slate-200 pb-2">
              <h3 className="font-bold text-lg text-slate-700">
                {editandoId ? '✏️ Editando Movimiento' : 'Registrar Movimiento'}
              </h3>
              {editandoId && (
                <button 
                  type="button" 
                  onClick={() => { setEditandoId(null); setMonto(''); setDescripcion(''); }}
                  className="text-xs text-rose-600 font-semibold hover:underline"
                >
                  Cancelar Edición
                </button>
              )}
            </div>
            <div>
              <label className="block text-xs font-medium text-slate-600 mb-1">Monto del Gasto ($)</label>
              <input 
                type="number" 
                value={monto} 
                onChange={(e) => setMonto(e.target.value)}
                placeholder="0" 
                className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-slate-900 focus:outline-none focus:border-emerald-500" 
                required 
              />
            </div>
            <div>
              <label className="block text-xs font-medium text-slate-600 mb-1">Descripción</label>
              <input 
                type="text" 
                value={descripcion} 
                onChange={(e) => setDescripcion(e.target.value)}
                placeholder="Ej: Compra supermercado" 
                className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-slate-900 focus:outline-none focus:border-emerald-500" 
              />
            </div>
            <div className="grid grid-cols-2 gap-2">
              <div>
                <label className="block text-xs font-medium text-slate-600 mb-1">Categoría</label>
                <select 
                  value={categoria} 
                  onChange={(e) => setCategoria(e.target.value)}
                  className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-slate-900"
                >
                  <option value="Supermercado">Supermercado</option>
                  <option value="Farmacia">Farmacia</option>
                  <option value="Servicios">Servicios</option>
                  <option value="Indumentaria">Indumentaria</option>
                  <option value="Varios">Varios</option>
                </select>
              </div>
              <div>
                <label className="block text-xs font-medium text-slate-600 mb-1">¿Cómo pagaste?</label>
                <select 
                  value={metodo} 
                  onChange={(e) => setMetodo(e.target.value)}
                  className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-slate-900"
                >
                  <option value="mercado_pago">Mercado Pago</option>
                  <option value="transferencia">Transferencia</option>
                  <option value="efectivo">Efectivo</option>
                  <option value="tarjeta_credito">Tarjeta de Crédito</option>
                </select>
              </div>
            </div>
            <button type="submit" className={`w-full text-white font-bold py-3 rounded-lg transition active:scale-95 shadow-sm ${editandoId ? 'bg-amber-600 hover:bg-amber-500' : 'bg-emerald-600 hover:bg-emerald-500'}`}>
              {editandoId ? 'Guardar Cambios del Gasto' : 'Descontar Gasto'}
            </button>
          </form>

          {/* SECCIÓN DE HERRAMIENTAS: Filtro, Exportar y Borrar Todo */}
          <div className="bg-white p-4 rounded-xl border border-slate-300 shadow-sm space-y-3">
            <h3 className="font-bold text-sm text-slate-700">⚙️ Herramientas y Filtros</h3>
            
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <div>
                <label className="block text-xs font-medium text-slate-500 mb-1">Filtrar por Mes</label>
                <select 
                  value={mesFiltro} 
                  onChange={(e) => setMesFiltro(e.target.value)}
                  className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-xs font-semibold text-slate-700"
                >
                  <option value="TODOS">Ver Todos los Meses</option>
                  {obtenerMesesDisponibles().map(mes => (
                    <option key={mes} value={mes}>{mes}</option>
                  ))}
                </select>
              </div>

              <div className="flex items-end">
                <button 
                  onClick={exportarExcel}
                  className="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-2 px-3 rounded-lg text-xs flex items-center justify-center gap-1 shadow-sm transition"
                >
                  📊 Descargar Excel (CSV)
                </button>
              </div>
            </div>

            <div className="pt-2 border-t border-slate-200">
              <button 
                onClick={vaciarTodosLosRegistros}
                className="w-full bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 font-bold py-2 rounded-lg text-xs transition flex items-center justify-center gap-1"
              >
                🗑️ Borrar TODOS los gastos (Reiniciar Mes)
              </button>
            </div>
          </div>

          {/* Historial */}
          <div className="space-y-3">
            <div className="flex justify-between items-center">
              <h3 className="font-bold text-lg text-slate-700">Registros</h3>
              <span className="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full font-bold">
                {txsFiltradas.length} gastos
              </span>
            </div>

            {cargando ? (
              <p className="text-sm text-slate-500 text-center py-4 bg-white rounded-lg border border-slate-200">Cargando datos desde la nube...</p>
            ) : txsFiltradas.length === 0 ? (
              <p className="text-sm text-slate-500 text-center py-4 bg-white rounded-lg border border-slate-200">No hay gastos en este filtro.</p>
            ) : (
              txsFiltradas.map(tx => (
                <div key={tx.id} className="bg-white p-3 rounded-lg border border-slate-300 shadow-sm flex justify-between items-center">
                  <div>
                    <p className="font-bold text-slate-800">{tx.descripcion || tx.categoria}</p>
                    <p className="text-xs text-slate-500">{tx.fecha} • {tx.categoria} (<span className="capitalize">{(tx.metodo || '').replace('_', ' ')}</span>)</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="font-bold text-rose-600">-${(tx.monto || 0).toLocaleString('es-AR')}</span>
                    <button 
                      onClick={() => editarTransaccion(tx)}
                      className="text-slate-400 hover:text-amber-600 font-bold p-1 rounded transition text-xs bg-slate-50 border border-slate-200"
                      title="Editar registro"
                    >
                      ✏️
                    </button>
                    <button 
                      onClick={() => eliminarTransaccion(tx.id)}
                      className="text-slate-400 hover:text-rose-600 font-bold px-2 py-0.5 rounded transition text-sm bg-slate-50 border border-slate-200"
                      title="Eliminar registro"
                    >
                      ✕
                    </button>
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
