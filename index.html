<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Gastos - SANIDENA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    function App() {
      const [saldosIniciales, setSaldosIniciales] = React.useState({
        mercado_pago: 0,
        transferencia: 0,
        efectivo: 0,
        tarjeta_credito: 0
      });
      const [editandoSaldos, setEditandoSaldos] = React.useState(false);
      const [tempSaldos, setTempSaldos] = React.useState(saldosIniciales);

      const [transacciones, setTransacciones] = React.useState([]);
      const [monto, setMonto] = React.useState('');
      const [descripcion, setDescripcion] = React.useState('');
      const [categoria, setCategoria] = React.useState('Supermercado');
      const [metodo, setMetodo] = React.useState('mercado_pago');

      const guardarSaldos = (e) => {
        e.preventDefault();
        setSaldosIniciales({
          mercado_pago: parseFloat(tempSaldos.mercado_pago) || 0,
          transferencia: parseFloat(tempSaldos.transferencia) || 0,
          efectivo: parseFloat(tempSaldos.efectivo) || 0,
          tarjeta_credito: parseFloat(tempSaldos.tarjeta_credito) || 0
        });
        setEditandoSaldos(false);
      };

      const agregarTransaccion = (e) => {
        e.preventDefault();
        if (!monto || isNaN(monto)) return;
        const nuevaTx = {
          id: Date.now(),
          monto: parseFloat(monto),
          descripcion,
          categoria,
          metodo,
          fecha: new Date().toLocaleDateString('es-AR')
        };
        setTransacciones([nuevaTx, ...transacciones]);
        setMonto('');
        setDescripcion('');
      };

      const totalIngresosIniciales = Object.values(saldosIniciales).reduce((a, b) => a + b, 0);
      const totalGastos = transacciones.reduce((acc, tx) => acc + tx.monto, 0);
      const saldoDisponible = totalIngresosIniciales - totalGastos;

      return (
        <div className="max-w-md mx-auto p-4 space-y-6">
          <header className="text-center border-b border-slate-300 pb-4">
            <h1 className="text-2xl font-bold text-emerald-700">Control de Gastos</h1>
            <p className="text-sm text-slate-600">Usuario: <span className="font-semibold text-slate-900">SANIDENA</span></p>
          </header>

          {/* Sección de Saldos Iniciales */}
          <div className="bg-white p-4 rounded-xl border border-slate-300 shadow-sm space-y-3">
            <div className="flex justify-between items-center">
              <h2 className="text-sm font-bold text-slate-700 uppercase">Saldos Iniciales / Cuentas</h2>
              <button 
                onClick={() => { setTempSaldos(saldosIniciales); setEditandoSaldos(!editandoSaldos); }}
                className="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-md font-semibold hover:bg-emerald-200 transition"
              >
                {editandoSaldos ? 'Cancelar' : 'Configurar Saldos'}
              </button>
            </div>

            {editandoSaldos ? (
              <form onSubmit={guardarSaldos} className="space-y-3 pt-2 border-t border-slate-200">
                <div className="grid grid-cols-2 gap-2 text-xs">
                  <div>
                    <label className="text-slate-600 font-medium">Mercado Pago</label>
                    <input type="number" value={tempSaldos.mercado_pago} onChange={e=>setTempSaldos({...tempSaldos, mercado_pago: e.target.value})} className="w-full border rounded p-1.5 mt-1 bg-slate-50" />
                  </div>
                  <div>
                    <label className="text-slate-600 font-medium">Transferencia</label>
                    <input type="number" value={tempSaldos.transferencia} onChange={e=>setTempSaldos({...tempSaldos, transferencia: e.target.value})} className="w-full border rounded p-1.5 mt-1 bg-slate-50" />
                  </div>
                  <div>
                    <label className="text-slate-600 font-medium">Efectivo</label>
                    <input type="number" value={tempSaldos.efectivo} onChange={e=>setTempSaldos({...tempSaldos, efectivo: e.target.value})} className="w-full border rounded p-1.5 mt-1 bg-slate-50" />
                  </div>
                  <div>
                    <label className="text-slate-600 font-medium">Tarjeta de Crédito</label>
                    <input type="number" value={tempSaldos.tarjeta_credito} onChange={e=>setTempSaldos({...tempSaldos, tarjeta_credito: e.target.value})} className="w-full border rounded p-1.5 mt-1 bg-slate-50" />
                  </div>
                </div>
                <button type="submit" className="w-full bg-emerald-600 text-white py-2 rounded-lg text-sm font-bold hover:bg-emerald-500">
                  Guardar Saldos Iniciales
                </button>
              </form>
            ) : (
              <div className="grid grid-cols-2 gap-2 text-xs pt-1">
                <div className="bg-slate-50 p-2 rounded border border-slate-200">
                  <span className="text-slate-500 block">Mercado Pago</span>
                  <span className="font-bold text-slate-800">${saldosIniciales.mercado_pago.toLocaleString('es-AR')}</span>
                </div>
                <div className="bg-slate-50 p-2 rounded border border-slate-200">
                  <span className="text-slate-500 block">Transferencia</span>
                  <span className="font-bold text-slate-800">${saldosIniciales.transferencia.toLocaleString('es-AR')}</span>
                </div>
                <div className="bg-slate-50 p-2 rounded border border-slate-200">
                  <span className="text-slate-500 block">Efectivo</span>
                  <span className="font-bold text-slate-800">${saldosIniciales.efectivo.toLocaleString('es-AR')}</span>
                </div>
                <div className="bg-slate-50 p-2 rounded border border-slate-200">
                  <span className="text-slate-500 block">Tarjeta Crédito</span>
                  <span className="font-bold text-slate-800">${saldosIniciales.tarjeta_credito.toLocaleString('es-AR')}</span>
                </div>
              </div>
            )}
          </div>

          {/* Resumen Total */}
          <div className="bg-white p-4 rounded-xl border border-slate-300 shadow-sm">
            <h2 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Saldo Líquido Disponible</h2>
            <p className="text-3xl font-extrabold text-emerald-600">${saldoDisponible.toLocaleString('es-AR')}</p>
            <p className="text-xs text-slate-400 mt-1">Total Gastado: ${totalGastos.toLocaleString('es-AR')}</p>
          </div>

          {/* Formulario de Movimientos */}
          <form onSubmit={agregarTransaccion} className="bg-white p-4 rounded-xl border border-slate-300 shadow-sm space-y-4">
            <h3 className="font-bold text-lg text-slate-700 border-b border-slate-200 pb-2">Registrar Movimiento</h3>
            <div>
              <label className="block text-xs font-medium text-slate-600 mb-1">Monto ($)</label>
              <input 
                type="number" 
                value={monto} 
                onChange={(e) => setMonto(e.target.value)}
                placeholder="0" 
                className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-slate-900 focus:outline-none focus:border-emerald-500" 
                required 
              />
            </div>
            <div>
              <label className="block text-xs font-medium text-slate-600 mb-1">Descripción</label>
              <input 
                type="text" 
                value={descripcion} 
                onChange={(e) => setDescripcion(e.target.value)}
                placeholder="Ej: Compra semanal" 
                className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-slate-900 focus:outline-none focus:border-emerald-500" 
              />
            </div>
            <div className="grid grid-cols-2 gap-2">
              <div>
                <label className="block text-xs font-medium text-slate-600 mb-1">Categoría</label>
                <select 
                  value={categoria} 
                  onChange={(e) => setCategoria(e.target.value)}
                  className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-slate-900"
                >
                  <option value="Supermercado">Supermercado</option>
                  <option value="Farmacia">Farmacia</option>
                  <option value="Servicios">Servicios</option>
                  <option value="Indumentaria">Indumentaria</option>
                  <option value="Varios">Varios</option>
                </select>
              </div>
              <div>
                <label className="block text-xs font-medium text-slate-600 mb-1">Medio de Pago</label>
                <select 
                  value={metodo} 
                  onChange={(e) => setMetodo(e.target.value)}
                  className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-slate-900"
                >
                  <option value="mercado_pago">Mercado Pago</option>
                  <option value="transferencia">Transferencia</option>
                  <option value="efectivo">Efectivo</option>
                  <option value="tarjeta_credito">Tarjeta de Crédito</option>
                </select>
              </div>
            </div>
            <button type="submit" className="w-full bg-emerald-600 text-white hover:bg-emerald-500 font-bold py-3 rounded-lg transition active:scale-95 shadow-sm">
              Guardar Gasto
            </button>
          </form>

          {/* Listado de Gastos */}
          <div className="space-y-3">
            <h3 className="font-bold text-lg text-slate-700">Últimos Registros</h3>
            {transacciones.length === 0 ? (
              <p className="text-sm text-slate-500 text-center py-4 bg-white rounded-lg border border-slate-200">No hay gastos cargados aún.</p>
            ) : (
              transacciones.map(tx => (
                <div key={tx.id} className="bg-white p-3 rounded-lg border border-slate-300 shadow-sm flex justify-between items-center">
                  <div>
                    <p className="font-bold text-slate-800">{tx.descripcion || tx.categoria}</p>
                    <p className="text-xs text-slate-500">{tx.fecha} • {tx.categoria} ({tx.metodo.replace('_', ' ')})</p>
                  </div>
                  <span className="font-bold text-rose-600">-${tx.monto.toLocaleString('es-AR')}</span>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
