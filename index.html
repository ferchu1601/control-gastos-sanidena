<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Gastos - SANIDENA</title>
  <!-- Tailwind CSS para los estilos -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React y React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel para interpretar el código React en el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [saldos, setSaldos] = useState({ mercado_pago: 0, transferencia: 0, efectivo: 0 });
      const [transacciones, setTransacciones] = useState([]);
      const [monto, setMonto] = useState('');
      const [descripcion, setDescripcion] = useState('');
      const [categoria, setCategoria] = useState('Supermercado');
      const [metodo, setMetodo] = useState('mercado_pago');

      const agregarTransaccion = (e) => {
        e.preventDefault();
        if (!monto || isNaN(monto)) return;
        const nuevaTx = {
          id: Date.now(),
          monto: parseFloat(monto),
          descripcion,
          categoria,
          metodo,
          fecha: new Date().toLocaleDateString('es-AR')
        };
        setTransacciones([nuevaTx, ...transacciones]);
        setMonto('');
        setDescripcion('');
      };

      const totalGastos = transacciones.reduce((acc, tx) => acc + tx.monto, 0);

      return (
        <div class="max-w-md mx-auto p-4 space-y-6">
          <header class="text-center border-b border-slate-700 pb-4">
            <h1 class="text-2xl font-bold text-emerald-400">Control de Gastos</h1>
            <p class="text-sm text-slate-400">Usuario: <span class="font-semibold text-white">SANIDENA</span></p>
          </header>

          <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Total Acumulado</h2>
            <p class="text-3xl font-extrabold text-white">${totalGastos.toLocaleString('es-AR')}</p>
          </div>

          <form onSubmit={agregarTransaccion} class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-4">
            <h3 class="font-bold text-lg border-b border-slate-700 pb-2">Registrar Movimiento</h3>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Monto ($)</label>
              <input 
                type="number" 
                value={monto} 
                onChange={(e) => setMonto(e.target.value)}
                placeholder="0" 
                class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-emerald-500" 
                required 
              />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Descripción</label>
              <input 
                type="text" 
                value={descripcion} 
                onChange={(e) => setDescripcion(e.target.value)}
                placeholder="Ej: Compra semanal" 
                class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-emerald-500" 
              />
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs text-slate-400 mb-1">Categoría</label>
                <select 
                  value={categoria} 
                  onChange={(e) => setCategoria(e.target.value)}
                  class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white"
                >
                  <option value="Supermercado">Supermercado</option>
                  <option value="Farmacia">Farmacia</option>
                  <option value="Servicios">Servicios</option>
                  <option value="Indumentaria">Indumentaria</option>
                  <option value="Varios">Varios</option>
                </select>
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">Medio de Pago</label>
                <select 
                  value={metodo} 
                  onChange={(e) => setMetodo(e.target.value)}
                  class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white"
                >
                  <option value="mercado_pago">Mercado Pago</option>
                  <option value="transferencia">Transferencia</option>
                  <option value="efectivo">Efectivo</option>
                  <option value="tarjeta_credito">Tarjeta de Crédito</option>
                </select>
              </div>
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-lg transition active:scale-95">
              Guardar Gastos
            </button>
          </form>

          <div class="space-y-3">
            <h3 class="font-bold text-lg text-slate-300">Últimos Registros</h3>
            {transacciones.length === 0 ? (
              <p class="text-sm text-slate-500 text-center py-4">No hay gastos cargados aún.</p>
            ) : (
              transacciones.map(tx => (
                <div key={tx.id} class="bg-slate-800 p-3 rounded-lg border border-slate-700 flex justify-between items-center">
                  <div>
                    <p class="font-bold">{tx.descripcion || tx.categoria}</p>
                    <p class="text-xs text-slate-400">{tx.fecha} • {tx.categoria} ({tx.metodo.replace('_', ' ')})</p>
                  </div>
                  <span class="font-bold text-rose-400">-${tx.monto.toLocaleString('es-AR')}</span>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
